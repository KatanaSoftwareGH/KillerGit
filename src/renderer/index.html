<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'">
  <title>KillerGit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="toolbar">
    <div class="tb-item" id="tb-repo"><small>Current repository</small><b>—</b></div>
    <div class="tb-item" id="tb-branch"><small>Current branch</small><b>—</b></div>
    <div class="tb-item" id="tb-sync"><small id="tb-sync-sub">Fetch</small><b id="tb-sync-label">Fetch origin</b></div>
    <div class="tb-item tb-remote" id="tb-remote" title="Remote used for fetch/pull/push"><small>Remote</small><b>—</b></div>
    <div class="spacer"></div>
    <button class="icon" id="btn-accounts" title="Accounts, keys & tokens">🔑</button>
    <button class="icon" id="btn-settings" title="Settings">⚙</button>
  </header>
  <div id="layout">
    <aside id="sidebar">
      <div class="side-head">
        <input id="repo-filter" placeholder="Filter repositories">
        <select id="repo-sort" title="Sort">
          <option value="az">A–Z</option>
          <option value="updated">Last updated</option>
        </select>
      </div>
      <div id="repo-tree"></div>
      <div class="side-foot">
        <button id="btn-add">Add ▾</button>
      </div>
    </aside>
    <main id="main">
      <nav id="tabs">
        <button data-tab="changes" class="active">Changes</button>
        <button data-tab="history">History</button>
        <button data-tab="branches">Branches</button>
        <button data-tab="stashes">Stashes</button>
        <button data-tab="remotes">Remotes</button>
        <button data-tab="issues">Issues</button>
      </nav>
      <section id="view"></section>
    </main>
  </div>
  <footer id="statusbar"><span id="status-text">Ready</span><span id="status-log" title="Show output">▤</span></footer>
  <div id="overlay" hidden></div>
  <div id="menu" hidden></div>
  <script src="graph.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
